name: PetStore API Tests

on:
  push:
    branches: 
        - main
  pull_request:
    branches: 
        - main
  workflow_dispatch:

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Newman and HTML Extra Reporter
        run: npm install -g newman newman-reporter-htmlextra

      - name: Verify Collection and Environment files 
        run: |
          ls -la collections environments

      - name: Run Newman Tests
        shell: bash
        run: |
          set -o pipefail
          newman run "postman/collections/Petstore API Tests.postman_collection.json"` 
          -e "postman/environments/Petstore Env.postman_environment.json" \ 
          --reporters cli,htmlextra,json,junit \ 
          --reporter-htmlextra-export reports/api-test-report.html \ 
          --reporter-json-export reports/api-test-report.json \ 
          | tee reports/api-test-report.txt"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-reports
          path: reports/