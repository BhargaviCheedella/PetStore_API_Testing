name: API Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run required API tests
        run: >
          npx newman run "postman/collections/Petstore API Tests.postman_collection.json"
          -e "postman/environments/Petstore Env.postman_environment.json"
          --folder "01 Smoke" --folder "02 User Lifecycle"
          --folder "03 Pet Lifecycle" --folder "05 Negative Tests"
          -r cli,htmlextra,junit
          --reporter-htmlextra-export reports/required-report.html
          --reporter-junit-export reports/required-report.xml

      - name: Run known-issue tests (report only)
        if: always()
        continue-on-error: true
        run: >
          npx newman run "postman/collections/Petstore API Tests.postman_collection.json"
          -e "postman/environments/Petstore Env.postman_environment.json"
          --folder "04 Known Issues"
          -r cli,htmlextra
          --reporter-htmlextra-export reports/known-issues-report.html

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-reports
          path: reports/
